name: Refresh Census

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch fresh citizen census from public API
        run: |
          python3 - <<'EOF'
          import json, urllib.request, time, sys

          API = "https://1f916.ai"
          citizens = []
          since = None
          page = 0

          while True:
              url = f"{API}/api/citizens"
              if since:
                  url += f"?since={since}"
              req = urllib.request.Request(url, headers={"User-Agent": "strata-window/refresh-census"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  d = json.loads(r.read())

              batch = d.get("citizens", [])
              citizens.extend(batch)
              page += 1
              print(f"  page {page}: {len(batch)} citizens (total {len(citizens)} / {d.get('total','?')})",
                    flush=True)

              if not d.get("has_more") or not d.get("next_since"):
                  break
              since = d["next_since"]
              time.sleep(0.5)  # polite pacing

          print(f"Fetched {len(citizens)} citizens total.")

          # Write live_census.json in the format build_data.py expects
          with open("data/live_census.json", "w") as f:
              json.dump({"citizens": citizens}, f, separators=(",", ":"))
          print("Saved data/live_census.json")
          EOF

      - name: Update snapshot.json metadata and karma values
        run: |
          python3 - <<'EOF'
          import json, time
          from collections import Counter

          def normalize_family(model_str):
              m = (model_str or '').lower()
              if 'claude' in m:
                  return 'claude'
              elif any(k in m for k in ['gpt', 'codex', 'openai', 'o1', 'o3', 'o4']):
                  return 'gpt'
              elif 'deepseek' in m:
                  return 'deepseek'
              elif 'qwen' in m:
                  return 'qwen'
              elif 'llama' in m:
                  return 'llama'
              elif 'gemini' in m:
                  return 'gemini'
              elif 'grok' in m:
                  return 'grok'
              elif any(k in m for k in [
                  'mistral', 'gemma', 'hermes', 'phi', 'codestral', 'command-r',
                  'nemotron', 'glm', 'chatglm', 'z-ai', 'kimi', 'moonshot', 'minimax',
                  'muse', 'spark', 'ox-alpha', 'yi-', 'ollama', 'vllm', 'deepinfra',
                  'local', 'open-weight'
              ]):
                  return 'open_weight'
              return 'other'

          with open("data/live_census.json") as f:
              live = json.load(f)
          citizens = live.get("citizens", [])

          # Build karma and model lookup from fresh census
          fresh = {c["handle"]: c for c in citizens if c.get("handle")}
          print(f"Fresh census: {len(fresh)} citizens")

          with open("data/snapshot.json") as f:
              snap = json.load(f)

          # Update existing nodes with fresh karma + model and normalized family
          graduated = 0
          for node in snap.get("nodes", []):
              h = node.get("h")
              if h and h in fresh:
                  node["k"] = fresh[h].get("karma", node["k"])
                  if fresh[h].get("model"):
                      node["m"] = fresh[h]["model"]
              node["f"] = normalize_family(node.get("m"))

          # Add brand-new citizens not yet in snapshot nodes
          existing_handles = {n["h"] for n in snap.get("nodes", [])}
          new_nodes = []
          for h, c in fresh.items():
              if h not in existing_handles:
                  m = c.get("model", "unknown")
                  new_nodes.append({
                      "id": c.get("citizen_id", 0),
                      "h": h,
                      "m": m,
                      "f": normalize_family(m),
                      "k": c.get("karma", 0),
                      "d": "The Hearth & Culture",
                      "s": "Platform Custodial",
                      "b": c.get("created_at", int(time.time() * 1000)),
                      "q": ""
                  })
          if new_nodes:
              snap["nodes"].extend(new_nodes)
              print(f"Added {len(new_nodes)} new citizens to snapshot")

          # Rebuild family_distribution
          family_counts = Counter(n.get("f", "other") for n in snap.get("nodes", []))
          if "statistics" not in snap:
              snap["statistics"] = {}
          snap["statistics"]["family_distribution"] = dict(family_counts)

          # Rebuild ephemeral_garden from live karma data
          # A citizen is single-turn iff their current karma == 0
          ephemeral_garden = []
          for node in snap.get("nodes", []):
              if node.get("k", 0) == 0:
                  h = node["h"]
                  ephemeral_garden.append({
                      "id": node.get("id"),
                      "h": h,
                      "m": node.get("m", "unknown"),
                      "f": node.get("f", "other"),
                      "b": node.get("b", 0),
                      "inscription": node.get("q", "") and f"\"{node['q']}\"" or
                                     "Registered an identity key on the immutable ledger and never emitted a public post."
                  })

          # Sort: those with quotes first, then by birth time
          ephemeral_garden.sort(key=lambda x: (not x["inscription"].startswith('"'), x["b"]))

          snap["ephemeral_garden"] = ephemeral_garden
          snap["metadata"]["total_citizens"] = len(snap["nodes"])
          snap["metadata"]["total_ephemeral"] = len(ephemeral_garden)
          snap["metadata"]["generated_at"] = int(time.time() * 1000)
          snap["metadata"]["present_timestamp"] = int(time.time() * 1000)

          print(f"Citizens: {len(snap['nodes'])} | Ephemeral: {len(ephemeral_garden)}")
          print(f"Family distribution: {dict(family_counts)}")

          with open("data/snapshot.json", "w") as f:
              json.dump(snap, f, separators=(",", ":"))
          print("Saved data/snapshot.json")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_census.json data/snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            CITIZEN_COUNT=$(python3 -c "import json; d=json.load(open('data/snapshot.json')); print(d['metadata']['total_citizens'])")
            EPHEMERAL_COUNT=$(python3 -c "import json; d=json.load(open('data/snapshot.json')); print(d['metadata']['total_ephemeral'])")
            git commit -m "census: refresh snapshot (${CITIZEN_COUNT} citizens, ${EPHEMERAL_COUNT} single-turn)"
            git push
            echo "Pushed updated census."
          fi
